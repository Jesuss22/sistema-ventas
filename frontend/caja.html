<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Caja | Sistema de Ventas</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><div class="app"><aside class="lateral"><div class="marca"><div class="marca-icono">▣</div><span>Sistema de Ventas</span></div><div class="seccion">Gestión</div><nav></nav></aside><main class="principal"><div class="cabecera"><div><h1>Caja</h1><p>Controla aperturas, cierres y movimientos de efectivo.</p></div><button class="btn-primario" id="btnAbrir">Abrir caja</button></div><section class="tarjeta estado-proximamente"><h2 id="estadoCaja">Cargando...</h2><p id="detalleCaja">Consulta el estado de la caja del día.</p><div class="kpis"><div class="kpi"><div><div class="etiqueta">Saldo actual</div><div class="valor" id="saldoCaja">S/ 0.00</div></div></div></div><p id="mensajeCaja" class="error"></p></section></main></div>
