<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Usuarios | Sistema de Ventas</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><div class="app"><aside class="lateral"><div class="marca"><div class="marca-icono">▣</div><span>Sistema de Ventas</span></div><div class="seccion">Gestión</div><nav></nav></aside><main class="principal"><div class="cabecera"><div><h1>Usuarios</h1><p>Administra los accesos y roles del sistema.</p></div><button class="btn-primario" id="btnNuevo">+ Nuevo usuario</button></div><section class="tarjeta"><div class="tabla-wrap"><table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead><tbody id="tablaUsuarios"></tbody></table></div><p id="mensajeUsuarios" class="error"></p></section></main></div>
<div class="modal" id="modal"><div class="modal-contenido"><h3>Nuevo usuario</h3><p class="ayuda">Crea un acceso para un vendedor o administrador.</p><form id="formUsuario"><label>Nombre *</label><input id="nombre" required><label>Correo electrónico *</label><input id="email" type="email" required><label>Contraseña *</label><input id="password" type="password" minlength="6" required><label>Rol</label><select id="rol"><option value="vendedor">Vendedor</option><option value="admin">Administrador</option></select><p id="mensajeForm" class="error"></p><div class="botones-modal"><button type="button" class="btn-secundario" id="btnCancelar">Cancelar</button><button type="submit" class="btn-primario">Crear usuario</button></div></form></div></div>
<script src="js/api.js"></script><script src="js/menu.js"></script><script src="js/usuarios.js"></script></body>
</html>
