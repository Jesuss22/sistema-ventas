<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Proveedores | Sistema de Ventas</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><div class="app"><aside class="lateral"><div class="marca"><div class="marca-icono">▣</div><span>Sistema de Ventas</span></div><div class="seccion">Gestión</div><nav></nav></aside><main class="principal"><div class="cabecera"><div><h1>Proveedores y compras</h1><p>Administra proveedores y registra el ingreso de mercadería.</p></div><button class="btn-primario" id="btnNuevo">+ Nuevo proveedor</button></div><section class="tarjeta"><div class="tabla-wrap"><table><thead><tr><th>Proveedor</th><th>Documento</th><th>Teléfono</th><th>Email</th><th>Dirección</th></tr></thead><tbody id="tablaProveedores"></tbody></table></div><p id="mensajeProveedores" class="error"></p></section></main></div>
<div class="modal" id="modal"><div class="modal-contenido"><h3>Nuevo proveedor</h3><p class="ayuda">Registra los datos básicos del proveedor.</p><form id="formProveedor"><label>Nombre *</label><input id="nombre" required><label>Documento</label><input id="documento"><label>Teléfono</label><input id="telefono"><label>Email</label><input id="email" type="email"><label>Dirección</label><input id="direccion"><p id="mensajeForm" class="error"></p><div class="botones-modal"><button type="button" class="btn-secundario" id="btnCancelar">Cancelar</button><button type="submit" class="btn-primario">Crear proveedor</button></div></form></div></div>
<script src="js/api.js"></script><script src="js/menu.js"></script><script src="js/proveedores.js"></script></body>
</html>
